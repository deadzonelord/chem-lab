<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>طرائق فصل المواد | أ. حسين التميمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 12px; background-color: #0b0f19; color: #e2e8f0;
      font-family: 'Cairo', system-ui, sans-serif; display: flex; flex-direction: column;
      align-items: center; min-height: 100vh;
    }
    .container { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 12px; }

    /* زر الرجوع */
    .top-nav { width: 100%; display: flex; justify-content: flex-start; margin-bottom: 2px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px; background: #1e293b;
      color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 6px 14px;
      border-radius: 99px; text-decoration: none; font-size: 13px; font-weight: bold;
    }
    .back-btn:active { transform: scale(0.96); background: #334155; }

    .header { text-align: center; margin-top: 2px; }
    .header h1 { font-size: 18px; margin: 0; color: #38bdf8; }
    
    /* شريط التبويبات (أفقي قابل للتمرير) */
    .tabs-container {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
      scrollbar-width: none; /* إخفاء شريط التمرير */
    }
    .tabs-container::-webkit-scrollbar { display: none; }
    
    .tab-btn {
      flex: 0 0 auto; background: #1e293b; border: 1px solid #334155; color: #cbd5e1;
      padding: 6px 14px; border-radius: 8px; font-size: 12.5px; font-weight: bold;
      cursor: pointer; transition: 0.2s; font-family: 'Cairo', sans-serif;
    }
    .tab-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    /* منطقة العرض */
    .canvas-wrapper {
      position: relative; width: 100%; background: #111827; border-radius: 14px;
      border: 1px solid #1f2937; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; justify-content: center;
    }
    canvas { display: block; width: 100%; max-width: 420px; height: auto; }

    /* لوحة التحكم */
    .controls-panel {
      width: 100%; background: #1e293b; padding: 12px; border-radius: 12px;
      display: flex; gap: 12px; border: 1px solid #334155;
    }
    .action-btn {
      flex: 1; background: #10b981; color: #ffffff; border: 1px solid #34d399;
      padding: 10px 0; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;
      font-family: 'Cairo', sans-serif; transition: 0.15s;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-btn.reset { background: #334155; border-color: #475569; color: #f1f5f9; }

    /* صندوق الشرح */
    .info-card {
      width: 100%; background: #0f172a; border-right: 4px solid #38bdf8;
      border-radius: 8px; padding: 12px 14px; font-size: 12.5px; line-height: 1.6; min-height: 90px;
    }
    .info-title { font-weight: bold; color: #38bdf8; margin-bottom: 4px; font-size: 13.5px; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-nav"><a href="index.html" class="back-btn">⬅ الرجوع لقائمة التجارب</a></div>
  <div class="header"><h1>مختبر طرائق فصل المواد</h1></div>

  <div class="tabs-container" id="tabsBox">
    <!-- سيتم تعبئة الأزرار هنا عبر الجافاسكريبت -->
  </div>

  <div class="canvas-wrapper">
    <canvas id="simCanvas" width="420" height="320"></canvas>
  </div>

  <div class="controls-panel">
    <button class="action-btn" id="startBtn" onclick="toggleProcess()">▶ بدء عملية الفصل</button>
    <button class="action-btn reset" onclick="resetProcess()">🔄 إعادة تهيئة</button>
  </div>

  <div class="info-card">
    <div class="info-title" id="infoTitle">الترشيح</div>
    <div id="infoText">جاري التحميل...</div>
  </div>
</div>

<script>
  const canvas = document.getElementById("simCanvas");
  const ctx = canvas.getContext("2d");
  const infoTitle = document.getElementById("infoTitle");
  const infoText = document.getElementById("infoText");
  const startBtn = document.getElementById("startBtn");
  const tabsBox = document.getElementById("tabsBox");

  let activeMethod = 0;
  let isRunning = false;
  let progress = 0; // 0 to 1
  let particles = []; // لاستخدامها في الأنيميشن

  // بيانات طرق الفصل الـ 7
  const methods = [
    {
      id: 0, title: "1. الترشيح", 
      desc: "تُستخدم لفصل مادة صلبة غير ذائبة (مثل الرمل) عن سائل (الماء) باستخدام ورقة ترشيح تسمح بنفاذ السائل وتحتجز المادة الصلبة."
    },
    {
      id: 1, title: "2. قمع الفصل", 
      desc: "تُستخدم لفصل سائلين غير ممتزجين (مثل الزيت والماء). يعتمد الفصل على اختلاف الكثافة؛ فالماء الأثقل ينزل أولاً عبر الصمام."
    },
    {
      id: 2, title: "3. التبخير", 
      desc: "تُستخدم لفصل مادة صلبة ذائبة تماماً في سائل (مثل الملح في الماء). بتبخير السائل كلياً تتبقى المادة الصلبة في القاع."
    },
    {
      id: 3, title: "4. التبلور", 
      desc: "فصل المواد الصلبة الذائبة على شكل بلورات نقية (مثل السكر) عند تبريد المحلول المركز، حيث تنتقل الكتلة الصلبة لشكل بلوري."
    },
    {
      id: 4, title: "5. الطرد المركزي", 
      desc: "فصل المخاليط (كبلازما الدم) بتطبيق قوة طرد مركزي ودوران سريع جداً؛ فتترسب الجسيمات حسب كثافتها وحجمها."
    },
    {
      id: 5, title: "6. الكروماتوغرافيا", 
      desc: "الطور المتحرك (المذيب) يسحب مكونات العينة (الحبر) عبر الطور الثابت (الورقة) بسرعات مختلفة فتنفصل الألوان."
    },
    {
      id: 6, title: "7. التحليل الكهربائي", 
      desc: "تمرير تيار كهربائي لتفكيك السائل. في الماء يتحرر حجمان من غاز الهيدروجين (كاثود) وحجم واحد من غاز الأوكسجين (أنود)."
    }
  ];

  // بناء أزرار التبويبات
  methods.forEach((m, idx) => {
    const btn = document.createElement("button");
    btn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
    btn.innerText = m.title;
    btn.onclick = () => selectMethod(idx);
    tabsBox.appendChild(btn);
  });

  function selectMethod(idx) {
    activeMethod = idx;
    document.querySelectorAll(".tab-btn").forEach((b, i) => b.className = i === idx ? "tab-btn active" : "tab-btn");
    infoTitle.innerText = methods[idx].title.substring(3);
    infoText.innerText = methods[idx].desc;
    resetProcess();
  }

  function toggleProcess() {
    if(progress >= 1) return resetProcess();
    isRunning = !isRunning;
    startBtn.innerText = isRunning ? "⏸ إيقاف موقت" : "▶ متابعة الفصل";
    startBtn.style.background = isRunning ? "#f59e0b" : "#10b981";
  }

  function resetProcess() {
    isRunning = false;
    progress = 0;
    particles = [];
    startBtn.innerText = "▶ بدء عملية الفصل";
    startBtn.style.background = "#10b981";
    initParticles();
  }

  function initParticles() {
    if(activeMethod === 0) { // الترشيح: قطرات ماء
      for(let i=0; i<30; i++) particles.push({ x: 200 + Math.random()*20, y: 150 + Math.random()*50, speed: 1 + Math.random()*2 });
    }
    else if(activeMethod === 2) { // التبخير: بخار
      for(let i=0; i<40; i++) particles.push({ x: 170 + Math.random()*80, y: 180 + Math.random()*20, speed: 0.5 + Math.random(), phase: Math.random()*Math.PI*2 });
    }
    else if(activeMethod === 6) { // التحليل الكهربائي: فقاعات
      for(let i=0; i<60; i++) particles.push({ isH2: i%3!==0, y: 220 + Math.random()*30, offset: Math.random()*10 });
    }
  }

  // المحرك الرسومي
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(isRunning && progress < 1) {
      // سرعة التقدم تختلف حسب التجربة
      let speed = (activeMethod === 4 || activeMethod === 5) ? 0.003 : 0.005;
      progress += speed;
      if(progress >= 1) { progress = 1; isRunning = false; startBtn.innerText = "✅ اكتمل الفصل"; startBtn.style.background = "#3b82f6"; }
    }

    ctx.save();
    switch(activeMethod) {
      case 0: drawFiltration(); break;
      case 1: drawSepFunnel(); break;
      case 2: drawEvaporation(); break;
      case 3: drawCrystallization(); break;
      case 4: drawCentrifuge(); break;
      case 5: drawChromatography(); break;
      case 6: drawElectrolysis(); break;
    }
    ctx.restore();
    requestAnimationFrame(draw);
  }

  // --- دوال رسم التجارب ---

  function drawFiltration() {
    // دورق سفلي
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 3;
    ctx.strokeRect(170, 200, 80, 90);
    // ماء مفلتر
    let waterH = progress * 60;
    ctx.fillStyle = "rgba(56, 189, 248, 0.4)"; ctx.fillRect(172, 290 - waterH, 76, waterH);
    
    // القمع
    ctx.beginPath(); ctx.moveTo(150, 80); ctx.lineTo(270, 80); ctx.lineTo(220, 160); ctx.lineTo(200, 160); ctx.closePath(); ctx.stroke();
    ctx.fillRect(205, 160, 10, 30); // أنبوب القمع
    // ورقة الترشيح
    ctx.strokeStyle = "#f1f5f9"; ctx.beginPath(); ctx.moveTo(160, 85); ctx.lineTo(210, 155); ctx.lineTo(260, 85); ctx.stroke();
    // الرمل والماء المختلط
    let mixH = (1 - progress) * 60;
    if(mixH > 0) {
      ctx.fillStyle = "rgba(180, 83, 9, 0.6)";
      ctx.beginPath(); ctx.moveTo(210 - mixH*0.6, 155 - mixH); ctx.lineTo(210 + mixH*0.6, 155 - mixH); ctx.lineTo(210, 155); ctx.fill();
    }
    // الرمل المترسب (ثابت)
    ctx.fillStyle = "#92400e";
    ctx.beginPath(); ctx.moveTo(195, 120); ctx.lineTo(225, 120); ctx.lineTo(210, 155); ctx.fill();

    // قطرات نازلة
    if(isRunning && mixH > 0) {
      ctx.fillStyle = "#38bdf8";
      particles.forEach(p => {
        p.y += p.speed;
        if(p.y > 290 - waterH) p.y = 190;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 6); ctx.fill();
      });
    }
  }

  function drawSepFunnel() {
    // دورق استقبال
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 3; ctx.strokeRect(170, 220, 80, 70);
    let waterCollected = progress * 60;
    ctx.fillStyle = "rgba(56, 189, 248, 0.6)"; ctx.fillRect(172, 290 - waterCollected, 76, waterCollected);

    // قمع الفصل
    ctx.beginPath(); ctx.moveTo(160, 50); ctx.lineTo(260, 50); 
    ctx.quadraticCurveTo(270, 130, 220, 180); ctx.lineTo(200, 180); 
    ctx.quadraticCurveTo(150, 130, 160, 50); ctx.stroke();
    ctx.strokeRect(205, 180, 10, 20);
    // الصمام
    ctx.fillStyle = isRunning ? "#10b981" : "#ef4444"; ctx.fillRect(195, 185, 30, 6);

    // السوائل بالداخل
    ctx.save();
    ctx.clip(); // قص الرسم داخل القمع
    let waterLeft = 60 - progress * 60;
    let oilY = 140 - waterLeft;
    // زيت (طبقة عليا - كثافة أقل)
    ctx.fillStyle = "rgba(251, 191, 36, 0.8)"; ctx.fillRect(150, oilY - 40, 120, 40);
    // ماء (طبقة سفلى - كثافة أعلى)
    ctx.fillStyle = "rgba(56, 189, 248, 0.6)"; ctx.fillRect(150, oilY, 120, waterLeft + 50);
    ctx.restore();

    // خط النزول
    if(isRunning && progress < 1) { ctx.fillStyle = "rgba(56, 189, 248, 0.6)"; ctx.fillRect(208, 200, 4, 90 - waterCollected); }
  }

  function drawEvaporation() {
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 3; ctx.strokeRect(150, 140, 120, 100);
    let waterH = (1 - progress) * 70;
    if(waterH > 0) { ctx.fillStyle = "rgba(56, 189, 248, 0.3)"; ctx.fillRect(152, 240 - waterH, 116, waterH); }
    
    // الملح المترسب
    let saltH = progress * 15;
    ctx.fillStyle = "#f8fafc"; ctx.fillRect(152, 240 - saltH, 116, saltH);

    // موقد النار
    ctx.fillStyle = "#334155"; ctx.fillRect(180, 250, 60, 20);
    if(isRunning && progress < 1) {
      ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.moveTo(210, 235); ctx.lineTo(190, 250); ctx.lineTo(230, 250); ctx.fill();
      ctx.fillStyle = "#f59e0b"; ctx.beginPath(); ctx.moveTo(210, 240); ctx.lineTo(200, 250); ctx.lineTo(220, 250); ctx.fill();
      
      // بخار متصاعد
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      particles.forEach(p => {
        p.y -= p.speed; p.x += Math.sin(p.phase)*0.5; p.phase+=0.1;
        if(p.y < 50) { p.y = 240 - waterH; p.x = 170 + Math.random()*80; }
        ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 6); ctx.fill();
      });
    }
  }

  function drawCrystallization() {
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 3; ctx.strokeRect(160, 100, 100, 130);
    ctx.fillStyle = `rgba(16, 185, 129, ${0.7 - progress*0.4})`; // المحلول يصفو
    ctx.fillRect(162, 120, 96, 110);

    // بلورات تنمو
    let size = progress * 18;
    ctx.fillStyle = "#34d399"; ctx.strokeStyle = "#059669"; ctx.lineWidth = 2;
    [[210,210], [180,215], [230,220], [195,200], [220,190]].forEach(pos => {
      ctx.save(); ctx.translate(pos[0], pos[1]); ctx.rotate(pos[0]); 
      ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(size/1.5, 0); ctx.lineTo(0, size); ctx.lineTo(-size/1.5, 0); ctx.closePath();
      ctx.fill(); ctx.stroke(); ctx.restore();
    });
  }

  function drawCentrifuge() {
    // رسم جهاز الطرد (منظور علوي)
    ctx.translate(210, 160);
    let rot = isRunning ? Date.now() * 0.01 : 0;
    ctx.rotate(rot);
    ctx.fillStyle = "#334155"; ctx.beginPath(); ctx.arc(0, 0, 90, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(0, 0, 20, 0, 6.28); ctx.fill();
    
    for(let i=0; i<4; i++) {
      ctx.save(); ctx.rotate((Math.PI/2) * i);
      ctx.fillStyle = "rgba(255,255,255,0.1)"; ctx.fillRect(-15, 20, 30, 60); // حامل الأنبوب
      ctx.restore();
    }
    ctx.resetTransform();

    // أنبوب العرض الجانبي
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(350, 240, 15, 0, Math.PI); ctx.lineTo(335, 100); ctx.lineTo(365, 100); ctx.closePath(); ctx.stroke();
    
    // انفصال الدم
    let plasmaH = progress * 70;
    let cellsH = 140 - plasmaH;
    ctx.fillStyle = "#ef4444"; ctx.fillRect(337, 240 - cellsH, 26, cellsH); // خلايا حمراء
    ctx.fillStyle = "rgba(251, 191, 36, 0.8)"; ctx.fillRect(337, 100, 26, plasmaH); // بلازما (أصفر)
    
    if(progress < 1) { // دمج الألوان بالبداية
      ctx.fillStyle = `rgba(239, 68, 68, ${1-progress})`; ctx.fillRect(337, 100, 26, 140);
    }
  }

  function drawChromatography() {
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 3; ctx.strokeRect(150, 100, 120, 160);
    let solventY = 240 - progress * 120;
    ctx.fillStyle = "rgba(56, 189, 248, 0.2)"; ctx.fillRect(152, solventY, 116, 260 - solventY); // المذيب
    
    // ورقة الترشيح (الطور الثابت)
    ctx.fillStyle = "#f8fafc"; ctx.fillRect(180, 80, 60, 170);
    ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(180, 230); ctx.lineTo(240, 230); ctx.stroke(); // خط البداية

    // الألوان تنفصل
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(210, 230 - progress*100, 6 + progress*4, 0, 6.28); ctx.fill(); // أحمر أسرع
    ctx.fillStyle = "#38bdf8"; ctx.beginPath(); ctx.arc(210, 230 - progress*60, 6 + progress*4, 0, 6.28); ctx.fill();  // أزرق متوسط
    ctx.fillStyle = "#fbbf24"; ctx.beginPath(); ctx.arc(210, 230 - progress*30, 6 + progress*4, 0, 6.28); ctx.fill();  // أصفر أبطأ
    ctx.globalAlpha = 1.0;
  }

  function drawElectrolysis() {
    // وعاء الماء
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 3; ctx.strokeRect(120, 140, 180, 120);
    ctx.fillStyle = "rgba(56, 189, 248, 0.3)"; ctx.fillRect(122, 160, 176, 100);

    // أقطاب (غرافيت)
    ctx.fillStyle = "#334155"; ctx.fillRect(160, 180, 10, 80); ctx.fillRect(250, 180, 10, 80);
    
    // أنابيب اختبار مقلوبة
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2;
    ctx.strokeRect(150, 100, 30, 120); ctx.strokeRect(240, 100, 30, 120);

    // مستوى الماء داخل الأنابيب (الغاز يزيح الماء)
    let h2Vol = progress * 80;  // الكاثود (سالب)
    let o2Vol = progress * 40;  // الأنود (موجب) حجم الأوكسجين نصف الهيدروجين
    
    // الغاز
    ctx.fillStyle = "rgba(255,255,255,0.8)"; 
    ctx.fillRect(152, 102, 26, h2Vol); ctx.fillRect(242, 102, 26, o2Vol);
    // بقية الماء
    ctx.fillStyle = "rgba(56, 189, 248, 0.5)"; 
    ctx.fillRect(152, 102 + h2Vol, 26, 116 - h2Vol); ctx.fillRect(242, 102 + o2Vol, 26, 116 - o2Vol);

    // بطارية وأسلاك
    ctx.fillStyle = "#ef4444"; ctx.fillRect(205, 30, 30, 20); ctx.fillStyle = "#f8fafc"; ctx.fillText("+", 215, 45); // أنود
    ctx.fillStyle = "#0f172a"; ctx.fillRect(185, 30, 20, 20); ctx.fillStyle = "#f8fafc"; ctx.fillText("-", 192, 45); // كاثود
    ctx.strokeStyle = "#94a3b8"; ctx.beginPath(); ctx.moveTo(195, 50); ctx.lineTo(195, 80); ctx.lineTo(165, 80); ctx.lineTo(165, 180); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(220, 50); ctx.lineTo(220, 80); ctx.lineTo(255, 80); ctx.lineTo(255, 180); ctx.stroke();

    // فقاعات
    if(isRunning && progress < 1) {
      ctx.fillStyle = "#fff";
      particles.forEach(p => {
        p.y -= 2;
        let startX = p.isH2 ? 160 : 250;
        let limitY = p.isH2 ? 102 + h2Vol : 102 + o2Vol;
        if(p.y < limitY) p.y = 250;
        ctx.beginPath(); ctx.arc(startX + p.offset, p.y, 2, 0, 6); ctx.fill();
      });
    }
  }

  initParticles();
  requestAnimationFrame(draw);
</script>
</body>
</html>
