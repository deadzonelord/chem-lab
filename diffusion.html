<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محاكاة انتشار الأصباغ | أ. حسين التميمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 12px;
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* زر الرجوع */
    .top-nav {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 2px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 99px;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      transition: background 0.15s, transform 0.15s;
    }
    .back-btn:active {
      transform: scale(0.96);
      background: #334155;
    }

    .header {
      text-align: center;
      margin-top: 2px;
    }
    .header h1 {
      font-size: 18px;
      margin: 0;
      color: #38bdf8;
    }
    .header p {
      font-size: 11.5px;
      color: #94a3b8;
      margin: 3px 0 0 0;
    }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      background: #111827;
      border-radius: 14px;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      justify-content: center;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 400px;
      height: auto;
    }
    
    /* لوحة التحكم */
    .controls-panel {
      width: 100%;
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      gap: 12px;
      border: 1px solid #334155;
    }
    button {
      flex: 1;
      background: #0284c7;
      color: #ffffff;
      border: 1px solid #38bdf8;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Cairo', sans-serif;
    }
    button:active {
      transform: scale(0.96);
    }
    .btn-reset {
      background: #334155;
      border-color: #475569;
      color: #f1f5f9;
    }

    /* صندوق الشرح العلمي */
    .info-card {
      width: 100%;
      background: #0f172a;
      border-right: 4px solid #38bdf8;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.6;
      min-height: 80px;
    }
    .info-title {
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 4px;
      font-size: 13.5px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- شريط الرجوع للقائمة الرئيسية -->
  <div class="top-nav">
    <a href="index.html" class="back-btn">⬅ الرجوع لقائمة التجارب</a>
  </div>

  <div class="header">
    <h1>تجربة انتشار الأصباغ في الماء</h1>
    <p>إشراف: أ. حسين التميمي • كيمياء الأول متوسط</p>
  </div>

  <div class="canvas-wrapper">
    <canvas id="simCanvas" width="400" height="320"></canvas>
  </div>

  <div class="controls-panel">
    <button id="dropBtn" onclick="dropDye()">إسقاط قطرات الصبغة 💧</button>
    <button class="btn-reset" onclick="resetSim()">إعادة التجربة 🔄</button>
  </div>

  <div class="info-card">
    <div class="info-title" id="infoTitle">الملاحظة قبل بدء التجربة:</div>
    <div id="infoText">
      اضغط على زر إسقاط الصبغة لملاحظة الفرق في سرعة الانتشار بين الكأسين. راقب حركة جزيئات الماء (الدوائر الشفافة) في كل كأس.
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById("simCanvas");
  const ctx = canvas.getContext("2d");
  const infoTitle = document.getElementById("infoTitle");
  const infoText = document.getElementById("infoText");

  // إعدادات الكؤوس
  const beakers = {
    hot:  { x: 40, y: 70, width: 130, height: 180, temp: 'hot', label: 'ماء ساخن' },
    cold: { x: 230, y: 70, width: 130, height: 180, temp: 'cold', label: 'ماء بارد' }
  };

  let waterMolecules = [];
  let dyeParticles = [];
  let isDropped = false;
  let timer = 0;

  // تهيئة التجربة
  function initSim() {
    waterMolecules = [];
    dyeParticles = [];
    isDropped = false;
    timer = 0;
    infoTitle.textContent = "الملاحظة قبل بدء التجربة:";
    infoTitle.style.color = "#38bdf8";
    infoText.innerHTML = "اضغط على زر إسقاط الصبغة لملاحظة الفرق في سرعة الانتشار بين الكأسين. راقب حركة جزيئات الماء (الدوائر الشفافة) في كل كأس.";
    document.getElementById("dropBtn").disabled = false;
    document.getElementById("dropBtn").style.opacity = "1";

    // إنشاء جزيئات الماء كخلفية حركية
    for(let i=0; i<80; i++) {
      waterMolecules.push(createWaterMolecule(beakers.hot));
      waterMolecules.push(createWaterMolecule(beakers.cold));
    }
  }

  function createWaterMolecule(beaker) {
    return {
      x: beaker.x + Math.random() * beaker.width,
      y: beaker.y + 20 + Math.random() * (beaker.height - 20),
      temp: beaker.temp,
      radius: 4,
      vx: (Math.random() - 0.5) * (beaker.temp === 'hot' ? 3 : 0.8),
      vy: (Math.random() - 0.5) * (beaker.temp === 'hot' ? 3 : 0.8)
    };
  }

  // إسقاط الصبغة
  function dropDye() {
    if(isDropped) return;
    isDropped = true;
    document.getElementById("dropBtn").disabled = true;
    document.getElementById("dropBtn").style.opacity = "0.5";

    infoTitle.textContent = "أثناء التفاعل...";
    infoTitle.style.color = "#fbbf24";
    infoText.innerHTML = "لاحظ كيف تتصادم جزيئات الماء الساخن (السريعة) مع الصبغة بقوة، مما يؤدي إلى تشتتها وانتشارها بسرعة أكبر من الكأس البارد.";

    // توليد جزيئات الحبر
    for(let i=0; i<350; i++) {
      dyeParticles.push({
        x: beakers.hot.x + beakers.hot.width / 2 + (Math.random() - 0.5) * 10,
        y: beakers.hot.y - 10 + Math.random() * 5, // تسقط من أعلى الكأس بقليل
        temp: 'hot',
        vx: (Math.random() - 0.5) * 0.5,
        vy: 1 + Math.random() * 1.5, // سرعة سقوط مبدئية
        radius: 2.5
      });

      dyeParticles.push({
        x: beakers.cold.x + beakers.cold.width / 2 + (Math.random() - 0.5) * 10,
        y: beakers.cold.y - 10 + Math.random() * 5,
        temp: 'cold',
        vx: (Math.random() - 0.5) * 0.2,
        vy: 0.5 + Math.random() * 0.8, 
        radius: 2.5
      });
    }
  }

  function resetSim() {
    initSim();
  }

  // المحرك الفيزيائي للتحديث
  function updatePhysics() {
    if(isDropped) timer++;

    // تحديث جزيئات الماء
    waterMolecules.forEach(w => {
      let speed = w.temp === 'hot' ? 2.5 : 0.5;
      w.vx += (Math.random() - 0.5) * speed * 0.5;
      w.vy += (Math.random() - 0.5) * speed * 0.5;
      w.vx *= 0.95; w.vy *= 0.95;
      w.x += w.vx; w.y += w.vy;

      let b = w.temp === 'hot' ? beakers.hot : beakers.cold;
      if(w.x < b.x + 5) { w.x = b.x + 5; w.vx *= -1; }
      if(w.x > b.x + b.width - 5) { w.x = b.x + b.width - 5; w.vx *= -1; }
      if(w.y > b.y + b.height - 5) { w.y = b.y + b.height - 5; w.vy *= -1; }
      if(w.y < b.y + 20) { w.y = b.y + 20; w.vy *= -1; }
    });

    // تحديث جزيئات الصبغة
    dyeParticles.forEach(p => {
      let b = p.temp === 'hot' ? beakers.hot : beakers.cold;
      
      // تأثير الحرارة على الحركة البراونية (Brownian Motion)
      let diffusionRate = p.temp === 'hot' ? 1.8 : 0.35;
      
      p.vx += (Math.random() - 0.5) * diffusionRate;
      p.vy += (Math.random() - 0.5) * diffusionRate;

      // جاذبية خفيفة تسحب الحبر للأسفل
      p.vy += 0.02;

      // احتكاك لزج
      p.vx *= 0.92;
      p.vy *= 0.92;

      p.x += p.vx;
      p.y += p.vy;

      // حدود الكأس
      if(p.x < b.x + 5) { p.x = b.x + 5; p.vx *= -0.5; }
      if(p.x > b.x + b.width - 5) { p.x = b.x + b.width - 5; p.vx *= -0.5; }
      if(p.y > b.y + b.height - 5) { p.y = b.y + b.height - 5; p.vy *= -0.5; }
      // عدم الخروج من سطح الماء
      if(p.y < b.y + 20) { p.y = b.y + 20; p.vy *= -0.5; }
    });

    // تحديث النص بعد مرور وقت
    if(timer === 180) {
      infoTitle.textContent = "الاستنتاج العلمي:";
      infoTitle.style.color = "#10b981";
      infoText.innerHTML = "<b>الحرارة تزيد من الطاقة الحركية:</b> جزيئات الماء الساخن تتحرك بشكل أسرع بكثير من الماء البارد، مما يجعلها تنشر الصبغة في كافة أنحاء الكأس في وقت أقصر.";
    }
  }

  // رسم المشهد
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // رسم الكؤوس
    Object.values(beakers).forEach(b => {
      ctx.save();
      // الزجاج
      ctx.strokeStyle = "rgba(148, 163, 184, 0.6)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x, b.y + b.height);
      ctx.lineTo(b.x + b.width, b.y + b.height);
      ctx.lineTo(b.x + b.width, b.y);
      ctx.stroke();

      // مستوى الماء
      ctx.fillStyle = b.temp === 'hot' ? "rgba(239, 68, 68, 0.08)" : "rgba(56, 189, 248, 0.08)";
      ctx.fillRect(b.x + 2, b.y + 15, b.width - 4, b.height - 17);
      
      // خط سطح الماء
      ctx.strokeStyle = b.temp === 'hot' ? "rgba(239, 68, 68, 0.3)" : "rgba(56, 189, 248, 0.3)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x + 2, b.y + 15);
      ctx.lineTo(b.x + b.width - 2, b.y + 15);
      ctx.stroke();

      // التسمية (حار / بارد)
      ctx.fillStyle = b.temp === 'hot' ? "#ef4444" : "#38bdf8";
      ctx.font = "bold 14px 'Cairo', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(b.label, b.x + b.width/2, b.y + b.height + 20);
      
      // ميزان الحرارة (Thermometer icon)
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.fillRect(b.x - 15, b.y + 50, 6, 80);
      ctx.beginPath(); ctx.arc(b.x - 12, b.y + 130, 8, 0, Math.PI*2); ctx.fill();
      // السائل داخل الميزان
      ctx.fillStyle = b.temp === 'hot' ? "#ef4444" : "#38bdf8";
      let thHeight = b.temp === 'hot' ? 70 : 20;
      ctx.fillRect(b.x - 13, b.y + 130 - thHeight, 2, thHeight);
      ctx.beginPath(); ctx.arc(b.x - 12, b.y + 130, 5, 0, Math.PI*2); ctx.fill();

      ctx.restore();
    });

    // رسم جزيئات الماء
    waterMolecules.forEach(w => {
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
      ctx.fillStyle = w.temp === 'hot' ? "rgba(239, 68, 68, 0.15)" : "rgba(56, 189, 248, 0.15)";
      ctx.fill();
    });

    // رسم جزيئات الصبغة (أحمر قرمزي/بنفسجي)
    dyeParticles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(139, 92, 246, 0.7)"; // لون الحبر
      ctx.shadowColor = "rgba(139, 92, 246, 0.5)";
      ctx.shadowBlur = 4;
      ctx.fill();
    });

    requestAnimationFrame(loop);
  }

  function loop() {
    updatePhysics();
    render();
  }

  // تشغيل المحاكاة
  initSim();
  requestAnimationFrame(loop);
</script>
</body>
</html>
